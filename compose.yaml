name: ragplayground
services:
  api:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8780:8000"]
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:local-development-only@postgres/ragplayground
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_ARTIFACT_ROOT: /data/artifacts
      RAG_PROFILES_PATH: /config/profiles.yaml
    volumes: ["artifacts:/data/artifacts", "./config:/config:ro"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
  worker:
    build: .
    command: ["python", "-m", "workers.main"]
    env_file: .env
    environment:
      RAG_DATABASE_URL: postgresql+psycopg://rag:local-development-only@postgres/ragplayground
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_ARTIFACT_ROOT: /data/artifacts
      RAG_PROFILES_PATH: /config/profiles.yaml
    volumes: ["artifacts:/data/artifacts", "./config:/config:ro", "models:/root/.cache"]
    depends_on:
      postgres: {condition: service_healthy}
      qdrant: {condition: service_started}
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: rag, POSTGRES_PASSWORD: local-development-only, POSTGRES_DB: ragplayground}
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragplayground"]
      interval: 2s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.17.0
    volumes: ["vectors:/qdrant/storage"]
volumes:
  artifacts:
  postgres:
  vectors:
  models:
