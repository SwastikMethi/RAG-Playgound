name: ragplayground-cloud

x-app: &app
  image: rag-playground:hosted
  build: .
  user: "10001:10001"
  init: true
  restart: unless-stopped
  stop_grace_period: 120s
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  pids_limit: 256
  environment: &environment
    HOME: /home/rag
    RAG_MODE: live
    RAG_DEPLOYMENT: hosted
    RAG_PUBLIC_ORIGIN: https://${RAG_DOMAIN:?Set RAG_DOMAIN}
    RAG_TURNSTILE_SITE_KEY: ${RAG_TURNSTILE_SITE_KEY:?Set Turnstile site key}
    RAG_TURNSTILE_SECRET_KEY: ${RAG_TURNSTILE_SECRET_KEY:?Set Turnstile secret key}
    RAG_MASTER_KEY: ${RAG_MASTER_KEY:?Generate a fresh master key}
    RAG_DATABASE_URL: postgresql+psycopg://rag:${POSTGRES_PASSWORD:?Generate a database password}@postgres/ragplayground
    RAG_QDRANT_URL: http://qdrant:6333
    RAG_ARTIFACT_ROOT: /data/artifacts
    RAG_PROFILES_PATH: /config/profiles.yaml
    RAG_DATABASE_HOST_ALLOWLIST: ${RAG_DATABASE_HOST_ALLOWLIST:-[]}
    RAG_DATABASE_RELATION_ALLOWLIST: ${RAG_DATABASE_RELATION_ALLOWLIST:-[]}
    RAG_PROVIDER_HOST_ALLOWLIST: '["api.openai.com"]'
    RAG_MAX_COMPARE_RUNS: "1"
    RAG_WORKER_SLOTS: "2"
    RAG_PROVIDER_CONCURRENCY: "2"
    RAG_EMBEDDING_CONCURRENCY: "2"
    RAG_MAX_PROJECTS_PER_USER: "5"
    RAG_MAX_UPLOAD_BYTES_PER_USER: "524288000"
    RAG_MAX_ARTIFACT_BYTES_PER_USER: "2147483648"
    RAG_MAX_VECTORS_PER_USER: "100000"
    RAG_MAX_QUEUED_PER_USER: "64"
    RAG_MAX_QUEUED_JOBS: "256"
    RAG_MIN_FREE_BYTES: "21474836480"
    OMP_NUM_THREADS: "2"
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - /srv/ragplayground/artifacts:/data/artifacts
    - /srv/ragplayground/models:/home/rag/.cache
    - ./deploy/profiles.yaml:/config/profiles.yaml:ro
  networks: [private]
  logging: &logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  depends_on:
    migrate: {condition: service_completed_successfully}
    qdrant: {condition: service_started}

services:
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      RAG_DOMAIN: ${RAG_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/ragplayground/caddy/data:/data
      - /srv/ragplayground/caddy/config:/config
    networks:
      private: {ipv4_address: 172.30.77.2}
    mem_limit: 256m
    logging: *logging
    depends_on:
      api: {condition: service_healthy}
  api:
    <<: *app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips", "172.30.77.2", "--limit-concurrency", "16"]
    mem_limit: 1536m
    cpus: 1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
  worker:
    <<: *app
    command: ["python", "-m", "workers.main"]
    mem_limit: 6g
    cpus: 2
  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    mem_limit: 512m
    depends_on:
      postgres: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ragplayground
    volumes: ["/srv/ragplayground/postgres:/var/lib/postgresql/data"]
    networks: [private]
    mem_limit: 1g
    shm_size: 128m
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d ragplayground"]
      interval: 5s
      timeout: 3s
      retries: 30
  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    user: "10001:10001"
    environment:
      QDRANT__STORAGE__SNAPSHOTS_PATH: /qdrant/storage/snapshots
    volumes: ["/srv/ragplayground/vectors:/qdrant/storage"]
    networks: [private]
    mem_limit: 2g
    logging: *logging

networks:
  private:
    ipam:
      config: [{subnet: 172.30.77.0/24}]
