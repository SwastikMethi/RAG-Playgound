components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable:
          type: boolean
        details:
          type: object
        request_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
      required:
      - code
      - message
      - retryable
      - details
      - request_id
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      additionalProperties: false
    Project:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - created_at
      - updated_at
      additionalProperties: false
    CreateProject:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
      additionalProperties: false
    Job:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        project_id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
          - ingest_source
          - prepare_index
          - compare_run
          - export_lane
          - delete_source
        resource_id:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        created_at:
          type: string
          format: date-time
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        progress:
          type: object
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - id
      - project_id
      - kind
      - resource_id
      - status
      - created_at
      - started_at
      - completed_at
      - progress
      - error
      additionalProperties: false
    Source:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
        project_id:
          type: string
          minLength: 1
          maxLength: 128
        kind:
          type: string
          enum:
          - file
          - postgres
        display_name:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum:
          - processing
          - ready
          - failed
          - deleting
          - deleted
        content_sha256:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        size_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        metadata:
          type: object
        job_id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
        created_at:
          type: string
          format: date-time
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - id
      - project_id
      - kind
      - display_name
      - status
      - content_sha256
      - size_bytes
      - metadata
      - job_id
      - created_at
      - error
      additionalProperties: false
    SourcePreview:
      type: object
      properties:
        source_id:
          type: string
          minLength: 1
          maxLength: 128
        content:
          type: string
          minLength: 0
          maxLength: 50000
        location:
          type: object
          properties:
            kind:
              type: string
              enum:
              - pdf
              - text
              - database
            page_start:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            page_end:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            char_start:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            char_end:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            line_start:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            line_end:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            relation:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 300
              - type: 'null'
            record_key:
