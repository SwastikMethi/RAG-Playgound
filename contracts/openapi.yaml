                  type:
                  - string
                  - number
                  - boolean
                  - 'null'
              - type: 'null'
          required:
          - kind
          - page_start
          - page_end
          - char_start
          - char_end
          - line_start
          - line_end
          - relation
          - record_key
          additionalProperties: false
        truncated:
          type: boolean
