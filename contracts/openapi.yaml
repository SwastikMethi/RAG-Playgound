components:
  securitySchemes:
    ownerToken:
      type: http
      scheme: bearer
      description: Owner application token; never place in URLs.
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 80
        message:
          type: string
          minLength: 1
          maxLength: 2000
        retryable: &id005
          type: boolean
        details:
          type: object
        request_id:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - code
      - message
      - retryable
      - details
      - request_id
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
      additionalProperties: false
    Project:
      type: object
      properties:
        id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 120
        created_at: &id004
          type: string
          format: date-time
        updated_at: *id004
      required:
      - id
      - name
      - created_at
      - updated_at
      additionalProperties: false
    CreateProject:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required:
      - name
      additionalProperties: false
    Job:
      type: object
      properties:
        id: *id001
        project_id: *id001
        kind:
          type: string
          enum:
          - ingest_source
          - prepare_index
          - compare_run
          - export_lane
          - delete_source
        resource_id: *id001
        status:
          type: string
          enum:
          - queued
          - running
          - succeeded
          - failed
          - cancelled
        created_at: *id004
        started_at:
          anyOf:
          - *id004
          - type: 'null'
        completed_at:
          anyOf:
          - *id004
          - type: 'null'
        progress:
          type: object
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - id
      - project_id
      - kind
      - resource_id
      - status
      - created_at
      - started_at
      - completed_at
      - progress
      - error
      additionalProperties: false
    Source:
      type: object
      properties:
        id: *id001
        project_id: *id001
        kind:
          type: string
          enum:
          - file
          - postgres
        display_name:
          type: string
          minLength: 1
          maxLength: 300
        status:
          type: string
          enum:
          - processing
          - ready
          - failed
          - deleting
          - deleted
        content_sha256:
          anyOf:
          - &id006
            type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
        size_bytes:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
        metadata:
          type: object
        job_id:
          anyOf:
          - *id001
          - type: 'null'
        created_at: *id004
        error:
          anyOf:
          - $ref: '#/components/schemas/Error'
          - type: 'null'
      required:
      - id
      - project_id
      - kind
      - display_name
      - status
      - content_sha256
      - size_bytes
      - metadata
      - job_id
      - created_at
      - error
      additionalProperties: false
    SourcePreview:
      type: object
      properties:
        source_id: *id001
        content:
          type: string
          minLength: 0
          maxLength: 50000
        location:
          type: object
          properties:
            kind:
              type: string
              enum:
              - pdf
              - text
              - database
            page_start:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            page_end:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            char_start:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            char_end:
              anyOf:
              - type: integer
                minimum: 0
              - type: 'null'
            line_start:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            line_end:
              anyOf:
              - type: integer
                minimum: 1
              - type: 'null'
            relation:
              anyOf:
              - type: string
                minLength: 1
                maxLength: 300
              - type: 'null'
            record_key:
              anyOf:
              - type: object
                additionalProperties:
                  type:
                  - string
                  - number
                  - boolean
                  - 'null'
              - type: 'null'
          required:
          - kind
          - page_start
          - page_end
          - char_start
          - char_end
          - line_start
          - line_end
          - relation
          - record_key
          additionalProperties: false
        truncated: *id005
      required:
      - source_id
      - content
      - location
      - truncated
      additionalProperties: false
    SourceImpact:
      type: object
      properties:
        source_id: *id001
        corpus_count:
          type: integer
          minimum: 0
        run_count:
          type: integer
          minimum: 0
        bundle_count:
          type: integer
          minimum: 0
        export_count:
          type: integer
          minimum: 0
        active_job_ids:
          type: array
          items: *id001
          minItems: 0
      required:
      - source_id
      - corpus_count
      - run_count
      - bundle_count
      - export_count
      - active_job_ids
      additionalProperties: false
    UploadSource:
      type: object
      properties:
        file:
          type: string
          format: binary
        display_name:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - file
      additionalProperties: false
    PublicConnection:
      type: object
      properties:
        id: *id001
        project_id: *id001
        name:
          type: string
          minLength: 1
          maxLength: 120
        kind:
          const: postgres
        host:
          type: string
          minLength: 1
          maxLength: 300
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
          minLength: 1
          maxLength: 200
        ssl_mode:
          type: string
          enum:
          - verify-full
          - require
          - disable
        allowed_schemas:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 20
        created_at: *id004
      required:
      - id
      - project_id
      - name
      - kind
      - host
      - port
      - database
      - username
      - ssl_mode
      - allowed_schemas
      - created_at
      additionalProperties: false
    CreateConnection:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        host:
          type: string
          minLength: 1
          maxLength: 300
        port:
          type: integer
          minimum: 1
          maximum: 65535
        database:
          type: string
          minLength: 1
          maxLength: 200
        username:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
        ssl_mode:
          type: string
          enum:
          - verify-full
          - require
          - disable
        allowed_schemas:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 20
      required:
      - name
      - host
      - port
      - database
      - username
      - password
      - ssl_mode
      - allowed_schemas
      additionalProperties: false
    Relation:
      type: object
      properties:
        schema:
          type: string
          minLength: 1
          maxLength: 200
        name:
          type: string
          minLength: 1
          maxLength: 200
        kind:
          type: string
          enum:
          - table
          - view
        columns:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                minLength: 1
                maxLength: 200
              data_type:
                type: string
                minLength: 1
                maxLength: 200
              nullable: *id005
              selectable: *id005
            required:
            - name
            - data_type
            - nullable
            - selectable
            additionalProperties: false
          minItems: 1
        suggested_key_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 0
      required:
      - schema
      - name
      - kind
      - columns
      - suggested_key_columns
      additionalProperties: false
    CapturePostgres:
      type: object
      properties:
        connection_id: *id001
        schema:
          type: string
          minLength: 1
          maxLength: 200
        relation:
          type: string
          minLength: 1
          maxLength: 200
        key_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 8
        text_columns:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 200
          minItems: 1
          maxItems: 20
        updated_at_column:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
        max_rows:
          type: integer
          minimum: 1
